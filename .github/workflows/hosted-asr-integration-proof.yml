name: hosted-asr-image-size-proof
on:
  push:
    branches: [parallel/hosted-asr-image-size]
    paths:
      - 'deploy/hosted-asr/**'
      - 'server/fia/preparation/hosted-asr/**'
      - 'tests/preparation-hosted-asr/**'
      - '.github/workflows/hosted-asr-integration-proof.yml'
permissions:
  contents: read
concurrency:
  group: hosted-asr-integration-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-image-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire only hash-pinned model and binary wheels
        run: |
          python deploy/hosted-asr/ci-acquire.py work/asr-inputs
          python -m pip download --only-binary=:all: --platform manylinux2014_x86_64 --platform manylinux_2_28_x86_64 --python-version 312 --implementation cp --abi cp312 --require-hashes -r deploy/hosted-asr/requirements.lock -d work/asr-inputs/wheels
          node deploy/hosted-asr/prepare-build.mjs work/asr-inputs work/asr-context
      - uses: docker/setup-buildx-action@v3
      - name: Build exact offline image and local OCI export only
        run: |
          mkdir -p work/asr-proof
          docker buildx build --network=none --platform=linux/amd64 --provenance=false --sbom=false -f work/asr-context/Dockerfile.integration -t fia-asr-size-proof --output type=oci,dest=work/asr-image.tar,compression=gzip --load work/asr-context
          docker image inspect fia-asr-size-proof > work/asr-image-inspect.json
          python deploy/hosted-asr/ci-image-size.py work/asr-image.tar work/asr-image-inspect.json deploy/hosted-asr work/asr-proof/image-size.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-asr-image-size-proof
          path: work/asr-proof/image-size.json
          retention-days: 1
          if-no-files-found: ignore
