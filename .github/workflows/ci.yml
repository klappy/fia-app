name: ci

# Tests gate the PR, never the deploy build (LESSONS-3D-REVIEW § 6.5). The Workers build
# command is `npm run build` only; this workflow is the gate.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # CSS budget (RULING ~20:05 ET): no new per-screen stylesheet, no file past its ceiling; prints totals.
      - run: npm run check:css
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run test:contracts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The visual baselines run in the `visual` job below, inside Playwright's pinned image; the
      # per-pack Mark walk runs in the `mark-walk` job (136 packs, ~25 min on 4 workers).
      - run: npx playwright test --grep-invert "visual-baseline|mark-walk"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results
          retention-days: 7
  # Visual baselines (e2e/visual-baseline.spec.ts). Pixels depend on the machine's fonts and
  # libraries, so the spec runs inside Playwright's pinned image (fonts pinned further by
  # e2e/visual-fonts.conf), and the committed *-chromium-linux.png are that image's output. The tag must match @playwright/test in
  # package.json. On failure the job uploads `visual-results` (expected / actual / diff) and
  # `visual-baselines` (the snapshot folder re-rendered in this image): review the diffs,
  # then commit the PNGs from `visual-baselines` for an intended change. CI never commits them.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-results
          path: test-results
          retention-days: 7
      - name: Re-render the baselines in this image (artifact only)
        if: failure()
        run: npm run test:visual -- --update-snapshots=changed --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-baselines
          path: e2e/visual-baseline.spec.ts-snapshots
          retention-days: 7
  # Mark eng+spa ticket item 3: walk every Mark pack (eng + spa, 136) on the built app — every visible
  # part to S18, every resource once, no console error, no missing string; S03 and the catalog list all
  # 68 per language; Save for offline. The first/last-step shots (390×844, 1280×800) upload as
  # `mark-walk-shots` for the design lens.
  mark-walk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/mark-walk.spec.ts --workers=4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mark-walk-shots
          path: test-results
          retention-days: 7
  # Pipeline unit + data tests (rights lines, tier bytes, contracts). Offline: reads committed data/ only.
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci
      - run: npm test
      # Content checks per pack (units, every verse per edition, rights lines, ai:true slots) + narration characters.
      # The URL-200 half (`npm run check:urls`) needs S3 and GitHub, so it runs outside CI.
      - run: npm run check:content -- --chars
