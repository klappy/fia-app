name: hosted-asr-build-proof
on:
  push:
    branches: [parallel/hosted-asr]
    paths:
      - 'deploy/hosted-asr/**'
      - 'server/fia/preparation/hosted-asr/**'
      - 'tests/preparation-hosted-asr/**'
      - '.github/workflows/hosted-asr-proof.yml'
permissions:
  contents: read
concurrency:
  group: hosted-asr-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-image-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify private contracts and real process-group stop
        run: node --test tests/preparation-hosted-asr/dispatch.test.mjs tests/preparation-hosted-asr/watchdog.test.mjs tests/preparation-hosted-asr/locks.test.mjs tests/preparation-hosted-asr/dispatch-artifact.test.mjs
      - name: Acquire only hash-pinned model and binary wheels
        run: |
          python deploy/hosted-asr/ci-acquire.py work/asr-inputs
          python -m pip download --only-binary=:all: --require-hashes -r deploy/hosted-asr/requirements.lock -d work/asr-inputs/wheels
          node deploy/hosted-asr/prepare-build.mjs work/asr-inputs work/asr-context
      - name: Build offline image from verified inputs
        run: docker build --network=none --platform=linux/amd64 -t fia-asr-ci-proof work/asr-context
      - name: Measure isolated model load and resource guards
        run: |
          mkdir -p work/asr-proof
          docker image inspect fia-asr-ci-proof --format '{{.Id}}' > work/asr-proof/image-id.txt
          trap 'docker rm -f fia-asr-ci-proof-run >/dev/null 2>&1 || true' EXIT
          timeout --signal=TERM --kill-after=2s 60s docker run --name fia-asr-ci-proof-run --network=none --read-only --memory=4g --memory-swap=4g --cpus=2 --pids-limit=64 --tmpfs /scratch:rw,nosuid,nodev,noexec,size=268435456,mode=1777 --mount type=bind,src="$PWD/deploy/hosted-asr/ci-probe.py",dst=/proof.py,readonly --entrypoint python fia-asr-ci-proof /proof.py > work/asr-proof/runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-asr-linux-proof
          path: work/asr-proof
          retention-days: 1
          if-no-files-found: ignore
