<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font pin for e2e/visual-baseline.spec.ts (the spec hands it to Chromium as FONTCONFIG_FILE).
  The UI asks for system-ui / sans-serif. Inside mcr.microsoft.com/playwright (ci.yml `visual`)
  fontconfig answers WenQuanYi Zen Hei, one CJK face with no bold and no italic, so weights and
  slants vanish from the baselines. Put Liberation Sans / Serif / Mono (regular, bold, italic,
  bold italic; in that image and in Playwright's install-deps) first for the generic families.
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Liberation Mono</string></edit>
  </match>
</fontconfig>
