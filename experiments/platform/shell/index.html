<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIA platform probe</title>
<style>
  body{font:1rem/1.5 system-ui,sans-serif;margin:0;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  button{font:inherit;min-height:44px;min-width:44px;margin:0 8px 8px 0}
  #log{font:0.8rem/1.4 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<h1>FIA platform probe</h1>
<p>Feasibility harness only. Not the FIA Guide.</p>
<audio id="audio" preload="metadata"></audio>
<div role="group" aria-label="Playback">
  <button id="play" type="button">Play</button>
  <button id="pause" type="button">Pause</button>
  <button id="seek" type="button">Seek +5 s</button>
  <button id="save" type="button">Save position</button>
</div>
<p id="status" role="status" aria-live="polite"></p>
<h2>Events</h2>
<div id="log"></div>
<script type="module" src="./harness.js"></script>
</body>
</html>
